<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>校园地标（A-Frame）</title>
  <script src="libs/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- ===== 环境：天空 + 草地 + 主路（贯穿校门→教学楼，形成整体布局） ===== -->
    <a-sky color="#b3e5fc"></a-sky>
    <a-plane rotation="-90 0 0" width="40" height="40" color="#66bb6a"></a-plane>
    <a-plane rotation="-90 0 0" position="0 0.02 1" width="3" height="14" color="#8d6e63"></a-plane>

    <!-- ===== 光照：环境光 + 平行光（太阳） ===== -->
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" position="1 5 2" intensity="0.55" color="#fff8e1"></a-light>
 
    <!-- ===== 地标2：教学楼（主体 + 红屋顶 + 窗户 + 大门） ===== -->
    <a-box position="0 1.5 -5" width="6" height="3" depth="2.4" color="#f5f5f5"></a-box>
    <a-box position="0 3.2 -5" width="6.5" height="0.35" depth="2.8" color="#b71c1c"></a-box>

    <!-- ===== 地标4：旗杆与国旗（旗帜摆动动画） ===== -->
    <a-cylinder position="-4 2 -3" radius="0.05" height="4" color="#9e9e9e"></a-cylinder>
    <a-box
      position="-3.55 3.6 -3" width="0.85" height="0.55" depth="0.03" color="#e53935"
      animation="property: rotation; to: 0 14 0; dir: alternate; dur: 850; loop: true">
    </a-box>

    <!-- ===== 路灯×2（灯杆 + 发光灯球，其一带点光源） ===== -->
    <a-entity position="1.8 0 4">
      <a-cylinder position="0 1.1 0" radius="0.05" height="2.2" color="#455a64"></a-cylinder>
      <a-sphere position="0 2.3 0" radius="0.16" color="#fff59d"></a-sphere>
    </a-entity>
    <a-entity position="-1.8 0 4">
      <a-cylinder position="0 1.1 0" radius="0.05" height="2.2" color="#455a64"></a-cylinder>
      <a-sphere position="0 2.3 0" radius="0.16" color="#fff59d"></a-sphere>
      <a-light type="point" position="0 2.4 0" color="#fff59d" intensity="0.35" distance="6"></a-light>
    </a-entity>

    <!-- ===== 相机初始位：位于校门外，正对校园中轴 ===== -->
    <a-camera position="0 1.8 12.5"></a-camera>
  </a-scene>
</body>
</html>
